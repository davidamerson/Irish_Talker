<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IRISH TALKER - FIXED EDITION</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap');

        :root {
            --bg: #0f172a; 
            --panel: #1e293b; 
            --accent: #0ea5e9; /* Sky Blue */
            --user-bubble: #059669; /* Green */
            --bot-bubble: #334155; 
            --text: #f8fafc;
            --record: #ef4444;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        
        body { 
            font-family: 'Roboto', sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }

        /* --- DASHBOARD --- */
        .header { 
            padding: 20px; 
            text-align: center; 
            background: #020617; 
            border-bottom: 1px solid #334155; 
            flex-shrink: 0;
        }
        .app-name { font-size: 22px; font-weight: 900; color: var(--accent); letter-spacing: 1px; }
        .app-sub { font-size: 12px; color: #94a3b8; margin-top: 5px; }

        #dashboard { 
            flex: 1; 
            overflow-y: auto; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }

        .card { 
            background: var(--panel); 
            padding: 15px 20px; 
            border-radius: 12px; 
            display: flex; 
            align-items: center; 
            border: 1px solid #334155; 
            cursor: pointer; 
            transition: 0.2s; 
        }
        .card:active { transform: scale(0.98); background: #334155; }
        
        .card-num { 
            font-size: 14px; font-weight: bold; color: #64748b; margin-right: 15px; 
            min-width: 25px;
        }
        .card-info { flex: 1; }
        .card-title { font-weight: bold; font-size: 15px; margin-bottom: 2px; }
        .card-desc { font-size: 11px; color: #94a3b8; }
        .card-status { font-size: 18px; color: var(--accent); }

        /* --- CHAT INTERFACE --- */
        #chat-screen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: var(--bg); display: none; flex-direction: column; z-index: 100; 
        }

        .chat-nav { 
            padding: 10px 15px; background: #020617; border-bottom: 1px solid #334155; 
            display: flex; align-items: center; flex-shrink: 0;
        }
        .back-btn { background: none; border: none; color: white; font-size: 24px; padding: 10px; cursor: pointer; }
        
        .progress-container { flex: 1; margin: 0 15px; }
        .progress-label { font-size: 10px; color: #94a3b8; display: flex; justify-content: space-between; margin-bottom: 3px;}
        .progress-track { height: 6px; background: #334155; border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s; }

        .chat-box { 
            flex: 1; overflow-y: auto; padding: 20px; 
            display: flex; flex-direction: column; gap: 20px; 
            background-image: radial-gradient(#1e293b 1px, transparent 1px); background-size: 20px 20px;
        }

        .bubble { 
            max-width: 85%; padding: 14px 18px; border-radius: 18px; 
            font-size: 15px; line-height: 1.5; position: relative; animation: slideUp 0.3s ease; 
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .bot { align-self: flex-start; background: var(--bot-bubble); border-bottom-left-radius: 4px; border: 1px solid #475569; }
        .user { align-self: flex-end; background: var(--user-bubble); color: white; border-bottom-right-radius: 4px; text-align: right; }

        .si-text { display: block; font-size: 12px; color: #cbd5e1; margin-top: 6px; font-style: italic; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 4px; }
        .hint-text { display: block; font-size: 11px; color: #fcd34d; margin-top: 5px; font-weight: bold; }
        
        .audio-player { width: 100%; height: 30px; margin-top: 8px; filter: invert(1); opacity: 0.7; }

        /* --- CONTROLS --- */
        .controls { 
            padding: 20px; background: #020617; border-top: 1px solid #334155; 
            display: flex; flex-direction: column; align-items: center; gap: 15px; flex-shrink: 0;
        }

        .status-msg { font-size: 14px; color: #94a3b8; font-weight: bold; min-height: 20px; text-align: center; }
        .status-msg.rec { color: var(--record); animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .mic-wrapper { position: relative; width: 85px; height: 85px; display: flex; justify-content: center; align-items: center; }
        
        .mic-btn { 
            width: 85px; height: 85px; border-radius: 50%; background: var(--accent); 
            border: none; color: #0f172a; font-size: 36px; cursor: pointer; z-index: 2; 
            box-shadow: 0 0 25px rgba(14, 165, 233, 0.4); transition: 0.2s; 
            display: flex; align-items: center; justify-content: center;
        }
        .mic-btn:active, .mic-btn.active { transform: scale(1.15); background: var(--record); color: white; box-shadow: 0 0 40px rgba(239, 68, 68, 0.6); }
        .mic-btn.disabled { background: #334155; color: #64748b; pointer-events: none; box-shadow: none; transform: scale(1); }

        .buttons-row { display: flex; width: 100%; gap: 10px; }
        .btn-small { flex: 1; padding: 12px; background: var(--panel); border: 1px solid #334155; color: white; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; }
        .btn-small:active { background: #334155; }

    </style>
</head>
<body>

    <!-- SCREEN 1: DASHBOARD -->
    <div id="dashboard">
        <div class="header">
            <div class="app-name">IRISH TALKER <span style="font-size:12px; color:white; background:var(--record); padding:2px 6px; border-radius:4px;">FIXED</span></div>
            <div class="app-sub">Complete Spoken English Training System</div>
        </div>
        <div id="card-list"></div>
    </div>

    <!-- SCREEN 2: CHAT -->
    <div id="chat-screen">
        <div class="chat-nav">
            <button class="back-btn" onclick="app.close()">←</button>
            <div class="progress-container">
                <div class="progress-label">
                    <span id="level-title">Interview</span>
                    <span id="step-count">0/15</span>
                </div>
                <div class="progress-track"><div class="progress-fill" id="progress-bar"></div></div>
            </div>
        </div>

        <div class="chat-box" id="chat-box"></div>

        <div class="controls">
            <div class="status-msg" id="status-text">Initializing...</div>
            
            <div class="mic-wrapper">
                <button id="mic-btn" class="mic-btn">🎙️</button>
            </div>

            <div class="buttons-row">
                <button class="btn-small" onclick="app.replayBot()">🔊 Replay</button>
                <button class="btn-small" onclick="app.showHelp()">🆘 Help</button>
            </div>
        </div>
    </div>

    <script>
    // --- APP ENGINE ---
    const app = {
        data: [],
        activeScenario: null,
        stepIndex: 0,
        synth: window.speechSynthesis,
        mediaRecorder: null,
        chunks: [],
        stream: null,

        startApp: function() {
            this.renderDashboard();
            this.setupMic();
            if(this.synth.onvoiceschanged !== undefined) {
                this.synth.onvoiceschanged = () => this.loadVoices();
            }
            this.loadVoices();
        },

        loadVoices: function() {
            const voices = this.synth.getVoices();
            this.voice = voices.find(v => (v.lang.includes('GB') || v.lang.includes('UK')) && v.name.includes('Male')) || voices[0];
        },

        renderDashboard: function() {
            const list = document.getElementById('card-list');
            list.innerHTML = '';
            this.data.forEach((item, index) => {
                const el = document.createElement('div');
                el.className = 'card';
                el.onclick = () => this.openScenario(index);
                el.innerHTML = `
                    <div class="card-num">#${index + 1}</div>
                    <div class="card-info">
                        <div class="card-title">${item.title}</div>
                        <div class="card-desc">${item.desc}</div>
                    </div>
                    <div class="card-status">▶</div>
                `;
                list.appendChild(el);
            });
        },

        openScenario: function(index) {
            this.activeScenario = this.data[index];
            this.stepIndex = 0;
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'flex';
            document.getElementById('level-title').innerText = this.activeScenario.title;
            document.getElementById('chat-box').innerHTML = '';
            this.runStep();
        },

        close: function() {
            this.synth.cancel();
            if(this.stream) {
                this.stream.getTracks().forEach(track => track.stop());
                this.stream = null;
            }
            document.getElementById('chat-screen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'flex';
        },

        runStep: function() {
            const total = this.activeScenario.dialogue.length;
            document.getElementById('step-count').innerText = `${this.stepIndex}/${total}`;
            document.getElementById('progress-bar').style.width = `${(this.stepIndex / total) * 100}%`;

            if(this.stepIndex >= total) {
                this.addBubble('bot', "Excellent job! Scenario completed.", "නියමයි! කොටස අවසන්.");
                this.speak("Excellent job! Scenario completed.");
                this.setMicState(false, "Finished ✅");
                return;
            }

            const line = this.activeScenario.dialogue[this.stepIndex];

            if(line.role === 'bot') {
                this.setMicState(false, "Listen to Liam...");
                this.addBubble('bot', line.text, line.si);
                this.speak(line.text, () => {
                    this.stepIndex++;
                    setTimeout(() => this.runStep(), 800);
                });
            } else {
                this.setMicState(true, "Hold Mic & Speak");
            }
        },

        addBubble: function(role, text, si, audioUrl) {
            const box = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = `bubble ${role}`;
            let html = `<div>${text}</div><div class="si-text">${si}</div>`;
            if(role === 'user' && this.activeScenario.dialogue[this.stepIndex].hint) {
                html += `<div class="hint-text">Tip: ${this.activeScenario.dialogue[this.stepIndex].hint}</div>`;
            }
            if(audioUrl) {
                html += `<audio controls src="${audioUrl}" class="audio-player"></audio>`;
            }
            div.innerHTML = html;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        },

        speak: function(text, callback) {
            this.synth.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.voice = this.voice;
            u.rate = 0.9;
            u.onend = callback || null;
            this.synth.speak(u);
        },

        setMicState: function(enabled, msg) {
            const btn = document.getElementById('mic-btn');
            const txt = document.getElementById('status-text');
            txt.innerText = msg;
            if(enabled) {
                btn.classList.remove('disabled');
            } else {
                btn.classList.add('disabled');
                txt.classList.remove('rec');
            }
        },

        setupMic: function() {
            const btn = document.getElementById('mic-btn');
            const status = document.getElementById('status-text');

            const start = async (e) => {
                if(e.cancelable) e.preventDefault();
                if(btn.classList.contains('disabled')) return;
                try {
                    if (!this.stream) this.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    this.mediaRecorder = new MediaRecorder(this.stream);
                    this.chunks = [];
                    this.mediaRecorder.ondataavailable = e => this.chunks.push(e.data);
                    this.mediaRecorder.onstop = () => this.processAudio();
                    this.mediaRecorder.start();
                    btn.classList.add('active');
                    status.innerText = "Recording...";
                    status.classList.add('rec');
                } catch(err) {
                    alert("Allow Microphone Access!");
                }
            };

            const stop = (e) => {
                if(e.cancelable) e.preventDefault();
                if(this.mediaRecorder && this.mediaRecorder.state === 'recording') {
                    this.mediaRecorder.stop();
                    btn.classList.remove('active');
                    status.classList.remove('rec');
                    status.innerText = "Processing...";
                }
            };

            btn.addEventListener('mousedown', start);
            btn.addEventListener('mouseup', stop);
            btn.addEventListener('mouseleave', stop);
            btn.addEventListener('touchstart', start);
            btn.addEventListener('touchend', stop);
        },

        // FIXED: ADDED SAFETY TIMER TO PREVENT FREEZING
        processAudio: function() {
            const blob = new Blob(this.chunks, { type: 'audio/ogg' });
            const url = URL.createObjectURL(blob);
            const line = this.activeScenario.dialogue[this.stepIndex];

            this.addBubble('user', line.text, line.si, url);
            document.getElementById('status-text').innerText = "Good!";
            
            // Auto play
            const a = new Audio(url);
            
            // Safety mechanism: Ensure we advance even if audio fails or is too short
            let advanced = false;
            const advance = () => {
                if(advanced) return;
                advanced = true;
                this.stepIndex++;
                setTimeout(() => this.runStep(), 1000);
            };

            a.onend = advance;
            a.onerror = advance;
            
            // Force advance after 4 seconds max (Safety Timer)
            setTimeout(advance, 4000);
            
            a.play().catch(e => console.log("Autoplay blocked"));
        },

        replayBot: function() {
            let i = this.stepIndex - 1;
            if(i < 0) return;
            while(i >= 0) {
                if(this.activeScenario.dialogue[i].role === 'bot') {
                    this.speak(this.activeScenario.dialogue[i].text);
                    break;
                }
                i--;
            }
        },

        showHelp: function() {
            const line = this.activeScenario.dialogue[this.stepIndex];
            if(line.role === 'user') this.speak(line.text);
        }
    };

    // =============================================
    // DATA SECTION (Boss changed to Sir)
    // =============================================
    const scenarios = [
        // --- 1. THE BIG INTERVIEW ---
        {
            id: 1, title: "1. The Job Interview", icon: "👔", desc: "Full Interview Simulation",
            dialogue: [
                { role: 'bot', text: "Good morning. Please come in and sit down.", si: "සුභ උදෑසනක්. ඇතුලට ඇවිත් වාඩි වෙන්න." },
                { role: 'user', text: "Good morning sir. Thank you.", si: "සුභ උදෑසනක් සර්. ස්තූතියි.", hint: "Good morning sir." },
                { role: 'bot', text: "I have your CV here. Can you introduce yourself?", si: "ඔයාගේ CV එක මං ළඟ තියෙනවා. ඔයා ගැන පොඩ්ඩක් කියන්න." },
                { role: 'user', text: "I am Nuwan. I have 15 years experience in construction.", si: "මම නුවන්. මට ඉදිකිරීම් ක්ෂේත්‍රයේ අවුරුදු 15ක පලපුරුද්ද තියෙනවා.", hint: "I am Nuwan. 15 years experience." },
                { role: 'bot', text: "That is a lot. What is your main trade?", si: "ඒක ගොඩක්නේ. ඔයාගේ ප්‍රධානම රස්සාව මොකක්ද?" },
                { role: 'user', text: "I am a multi-skilled technician. Mainly Welding and Steel Fixing.", si: "මම බහු-නිපුණතා ශිල්පියෙක්. ප්‍රධාන වශයෙන් වෑල්ඩින් සහ යකඩ බැඳීම.", hint: "Multi-skilled. Welding and Steel Fixing." },
                { role: 'bot', text: "What type of welding can you do?", si: "මොන වගේ වෑල්ඩින් ද ඔයාට පුළුවන්?" },
                { role: 'user', text: "I am an expert in Arc Welding and heavy steel fabrication.", si: "මම ආක් වෑල්ඩින් සහ බර යකඩ වැඩ වලට දක්ෂයි.", hint: "Expert in Arc Welding." },
                { role: 'bot', text: "Can you read technical drawings and blueprints?", si: "ඔයාට ටෙක්නිකල් ඩ්‍රෝවින්ග්ස් සහ ප්ලෑන් කියවන්න පුළුවන්ද?" },
                { role: 'user', text: "Yes sir. I can read plans and work without supervision.", si: "ඔව් සර්. මට ප්ලෑන් කියවලා තනියම වැඩ කරන්න පුළුවන්.", hint: "Yes sir, I can read plans." },
                { role: 'bot', text: "Do you have experience with concrete?", si: "කොන්ක්‍රීට් එක්ක වැඩ කරලා තියෙනවද?" },
                { role: 'user', text: "Yes, I can do pouring, vibrating, and leveling.", si: "ඔව්, මට වත් කරන්න, වයිබ්‍රේට් කරන්න සහ ලෙවල් කරන්න පුළුවන්.", hint: "Pouring, vibrating, and leveling." },
                { role: 'bot', text: "Do you have a heavy vehicle license?", si: "බර වාහන බලපත්‍රයක් තියෙනවද?" },
                { role: 'user', text: "Yes, I have a valid heavy vehicle license.", si: "ඔව්, මට වලංගු බලපත්‍රයක් තියෙනවා.", hint: "Yes, I have a license." },
                { role: 'bot', text: "Why do you want to work in Ireland?", si: "ඇයි අයර්ලන්තයේ වැඩ කරන්න කැමති?" },
                { role: 'user', text: "I want to work hard and build a better future.", si: "මට මහන්සි වෙලා වැඩ කරලා හොඳ අනාගතයක් හදන්න ඕනා.", hint: "Work hard for better future." },
                { role: 'bot', text: "Okay Nuwan. When can you start?", si: "හරි නුවන්. කවදද පටන් ගන්න පුළුවන්?" },
                { role: 'user', text: "I can start immediately after my visa is ready.", si: "වීසා හම්බුන ගමන් මට පටන් ගන්න පුළුවන්.", hint: "Immediately after visa." },
                { role: 'bot', text: "Great. We will let you know soon.", si: "නියමයි. අපි ඉක්මනට දන්වන්නම්." },
                { role: 'user', text: "Thank you for your time sir.", si: "ඔබේ කාලයට ස්තූතියි සර්.", hint: "Thank you for your time sir." }
            ]
        },

        // --- 2. FIRST DAY INDUCTION ---
        {
            id: 2, title: "2. Site Induction", icon: "🚧", desc: "Safety rules and meeting the foreman.",
            dialogue: [
                { role: 'bot', text: "Welcome to the site Nuwan. I am the Site Manager.", si: "සයිට් එකට සාදරයෙන් පිළිගන්නවා. මම සයිට් මැනේජර්." },
                { role: 'user', text: "Good morning sir. Happy to be here.", si: "ගුඩ් මෝනින් සර්. මෙහේ ආපු එක සතුටක්.", hint: "Good morning sir." },
