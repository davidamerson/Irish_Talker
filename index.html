<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IRISH TALKER - ULTIMATE 20</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --success: #22c55e;
            --error: #ef4444;
            --text: #f8fafc;
            --bot-bubble: #334155;
            --user-bubble: #059669;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* DASHBOARD */
        #dashboard { flex: 1; padding: 15px; overflow-y: auto; }
        .header { text-align: center; padding: 20px 0; border-bottom: 1px solid #334155; margin-bottom: 15px; }
        .title { font-size: 24px; font-weight: 900; color: var(--accent); letter-spacing: -1px; }
        .subtitle { font-size: 13px; color: #94a3b8; margin-top: 5px; }
        
        .scenario-list { display: flex; flex-direction: column; gap: 12px; padding-bottom: 40px; }
        .card { background: var(--card); padding: 15px; border-radius: 12px; display: flex; align-items: center; border: 1px solid #334155; cursor: pointer; transition: 0.2s; }
        .card:active { background: #475569; transform: scale(0.98); }
        .icon { font-size: 28px; margin-right: 15px; min-width: 40px; text-align: center; }
        .info { flex: 1; }
        .s-title { font-weight: bold; font-size: 15px; }
        .s-desc { font-size: 11px; color: #94a3b8; }
        .badge { font-size: 10px; background: rgba(56, 189, 248, 0.1); color: var(--accent); padding: 3px 8px; border-radius: 4px; font-weight: bold; }

        /* CHAT SCREEN */
        #chat-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: none; flex-direction: column; z-index: 100; }
        .nav { padding: 12px; background: #020617; border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; }
        .back-btn { background: none; border: none; color: white; font-size: 24px; cursor: pointer; padding: 5px; }
        .progress { font-size: 12px; font-weight: bold; color: var(--accent); }

        .chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        .bubble { max-width: 85%; padding: 12px 16px; border-radius: 16px; font-size: 15px; line-height: 1.5; position: relative; animation: slideUp 0.3s; }
        @keyframes slideUp { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .bot { align-self: flex-start; background: var(--bot-bubble); border-bottom-left-radius: 2px; }
        .user { align-self: flex-end; background: var(--user-bubble); border-bottom-right-radius: 2px; text-align: right; }
        .si { font-size: 12px; color: #cbd5e1; display: block; margin-top: 4px; font-style: italic; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 4px; }
        .hint { font-size: 11px; color: #fcd34d; display: block; margin-top: 4px; font-weight: bold; }

        /* FEEDBACK BOX */
        .feedback { 
            background: #0f172a; border: 1px solid #334155; padding: 10px; border-radius: 8px; font-size: 12px; margin-top: 5px; display: none; text-align: left;
        }
        .fb-said { color: #fca5a5; display: block; margin-bottom: 3px; }
        .fb-correct { color: #86efac; display: block; font-weight: bold; }

        /* CONTROLS */
        .controls { padding: 20px; background: #020617; border-top: 1px solid #334155; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .status { font-size: 14px; font-weight: bold; color: #94a3b8; min-height: 20px; text-align: center; }
        .status.listening { color: var(--accent); animation: pulse 1s infinite; }
        @keyframes pulse { 50% { opacity: 0.5; } }

        .mic-btn { width: 75px; height: 75px; border-radius: 50%; background: var(--accent); border: none; font-size: 32px; cursor: pointer; box-shadow: 0 0 20px rgba(56, 189, 248, 0.3); transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .mic-btn:active { transform: scale(0.9); background: var(--success); }
        .mic-btn.active { background: var(--error); box-shadow: 0 0 30px rgba(239, 68, 68, 0.5); color: white; }
        .mic-btn.disabled { background: #334155; opacity: 0.5; pointer-events: none; box-shadow: none; }

        .btn-row { display: flex; gap: 10px; width: 100%; }
        .btn-sub { flex: 1; padding: 12px; background: var(--card); border: 1px solid #334155; color: white; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; }
        .btn-skip { background: #334155; color: #94a3b8; }

    </style>
</head>
<body>

    <div id="dashboard">
        <div class="header">
            <div class="title">IRISH TALKER</div>
            <div class="subtitle">Ultimate Training (20 Scenarios)</div>
        </div>
        <div id="list" class="scenario-list"></div>
    </div>

    <div id="chat-screen">
        <div class="nav">
            <button class="back-btn" onclick="app.close()">←</button>
            <div id="level-info" style="text-align:center;">
                <div id="lvl-title" style="font-weight:bold; font-size:14px;">...</div>
                <div id="lvl-prog" class="progress">0 / 20</div>
            </div>
            <div style="width:24px;"></div>
        </div>
        
        <div id="chat-box" class="chat-box"></div>

        <div class="controls">
            <div id="status" class="status">Initializing...</div>
            <button id="mic" class="mic-btn">🎙️</button>
            <div class="btn-row">
                <button class="btn-sub" onclick="app.replayBot()">🔊 Replay</button>
                <button class="btn-sub" onclick="app.showAnswer()">🆘 Answer</button>
                <button class="btn-sub btn-skip" onclick="app.skip()" id="btn-skip" style="display:none;">Skip ▶</button>
            </div>
        </div>
    </div>

    <script>
        // --- APP ENGINE ---
        const app = {
            data: [], // Filled by PART 2
            activeScenario: null,
            index: 0,
            synth: window.speechSynthesis,
            recognition: null,
            isListening: false,

            // Call this to boot up
            init: function() {
                this.renderDashboard();
                this.setupVoice();
                this.setupRecognition();
            },

            setupVoice: function() {
                if(this.synth.onvoiceschanged !== undefined) {
                    this.synth.onvoiceschanged = () => {
                        const voices = this.synth.getVoices();
                        // Try to get a UK Male Voice
                        this.voice = voices.find(v => (v.lang.includes('GB') || v.lang.includes('UK')) && v.name.includes('Male')) || voices[0];
                    };
                }
            },

            setupRecognition: function() {
                if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                    this.recognition = new SpeechRecognition();
                    this.recognition.lang = 'en-GB'; // Expect British/Irish English
                    this.recognition.continuous = false;
                    this.recognition.interimResults = false;

                    this.recognition.onstart = () => {
                        this.isListening = true;
                        document.getElementById('mic').classList.add('active');
                        document.getElementById('status').innerText = "Listening...";
                        document.getElementById('status').classList.add('listening');
                    };

                    this.recognition.onend = () => {
                        this.isListening = false;
                        document.getElementById('mic').classList.remove('active');
                        document.getElementById('status').classList.remove('listening');
                    };

                    this.recognition.onresult = (event) => {
                        const transcript = event.results[0][0].transcript;
                        this.checkAnswer(transcript);
                    };

                    this.recognition.onerror = (event) => {
                        document.getElementById('status').innerText = "Tap mic again.";
                        document.getElementById('btn-skip').style.display = 'block'; // Show skip on error
                    };
                } else {
                    alert("Voice features require Google Chrome.");
                }
            },

            // --- UI FUNCTIONS ---
            renderDashboard: function() {
                const list = document.getElementById('list');
                list.innerHTML = '';
                this.data.forEach((s, i) => {
                    const el = document.createElement('div');
                    el.className = 'card';
                    el.onclick = () => this.startScenario(i);
                    el.innerHTML = `
                        <div class="icon">${s.icon}</div>
                        <div class="info">
                            <div class="s-title">${s.title}</div>
                            <div class="s-desc">${s.desc}</div>
                        </div>
                        <div class="badge">START</div>
                    `;
                    list.appendChild(el);
                });
            },

            startScenario: function(index) {
                this.activeScenario = this.data[index];
                this.index = 0;
                document.getElementById('dashboard').style.display = 'none';
                document.getElementById('chat-screen').style.display = 'flex';
                document.getElementById('lvl-title').innerText = this.activeScenario.title;
                document.getElementById('chat-box').innerHTML = '';
                document.getElementById('btn-skip').style.display = 'none';
                
                this.runStep();
            },

            close: function() {
                this.synth.cancel();
                document.getElementById('chat-screen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'flex';
            },

            // --- GAME LOOP ---
            runStep: function() {
                const total = this.activeScenario.dialogue.length;
                document.getElementById('lvl-prog').innerText = `${this.index} / ${total}`;

                // Check Completion
                if(this.index >= total) {
                    this.addBubble('bot', "Conversation Finished! Well done.", "සංවාදය අවසන්.");
                    this.speak("Conversation Finished! Well done.");
                    this.setMicState(false, "Done ✅");
                    return;
                }

                const line = this.activeScenario.dialogue[this.index];

                if(line.r === 'b') {
                    // Bot Turn
                    this.setMicState(false, "Listen...");
                    this.addBubble('bot', line.t, line.s);
                    this.speak(line.t, () => {
                        this.index++;
                        setTimeout(() => this.runStep(), 800);
                    });
                } else {
                    // User Turn
                    this.setMicState(true, "Tap Mic & Answer");
                }
            },

            checkAnswer: function(spoken) {
                const target = this.activeScenario.dialogue[this.index].hint;
                
                // Compare (Simple Keyword Match)
                const s1 = spoken.toLowerCase().replace(/[^a-z0-9 ]/g, "");
                const s2 = target.toLowerCase().replace(/[^a-z0-9 ]/g, "");
                
                let match = false;
                // 1. Exact match
                if (s1 === s2) match = true;
                // 2. Contains match
                else if (s1.includes(s2)) match = true;
                // 3. Keyword match (if 50% of words match)
                else {
                    const tWords = s2.split(" ");
                    let hits = 0;
                    tWords.forEach(w => { if(s1.includes(w) && w.length > 2) hits++; });
                    if(hits >= Math.ceil(tWords.length / 2)) match = true;
                }

                // Add User Bubble with Feedback
                const box = document.getElementById('chat-box');
                const div = document.createElement('div');
                div.className = 'bubble user';
                div.innerHTML = `
                    <div>${spoken}</div>
                    <div class="feedback" style="display:block; border-color:${match ? 'var(--success)' : 'var(--error)'}">
                        <span class="fb-said">Said: "${spoken}"</span>
                        <span class="fb-correct">Target: "${target}"</span>
                        <div style="margin-top:5px; font-weight:bold; color:${match ? 'var(--success)' : 'var(--error)'}">
                            ${match ? 'CORRECT ✅' : 'TRY AGAIN ❌'}
                        </div>
                    </div>
                `;
                box.appendChild(div);
                box.scrollTop = box.scrollHeight;

                if(match) {
                    setTimeout(() => {
                        this.index++;
                        this.runStep();
                    }, 1500);
                } else {
                    this.speak("Try again. Say: " + target);
                    document.getElementById('btn-skip').style.display = 'block';
                }
            },

            // --- HELPERS ---
            addBubble: function(role, text, si) {
                const box = document.getElementById('chat-box');
                const div = document.createElement('div');
                div.className = `bubble ${role === 'b' ? 'bot' : 'user'}`;
                
                let html = `<div>${text}</div><span class="si">${si}</span>`;
                if(role === 'u' && this.activeScenario.dialogue[this.index].hint) {
                    html += `<span class="hint">Tip: ${this.activeScenario.dialogue[this.index].hint}</span>`;
                }
                div.innerHTML = html;
                box.appendChild(div);
                box.scrollTop = box.scrollHeight;
            },

            speak: function(text, callback) {
                this.synth.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.voice = this.voice;
                u.rate = 0.9;
                u.onend = callback || null;
                this.synth.speak(u);
            },

            setMicState: function(enabled, msg) {
                const btn = document.getElementById('mic');
                document.getElementById('status').innerText = msg;
                if(enabled) {
                    btn.classList.remove('disabled');
                    btn.onclick = () => {
                        if(this.isListening) this.recognition.stop();
                        else this.recognition.start();
                    };
                } else {
                    btn.classList.add('disabled');
                    btn.onclick = null;
                }
            },

            replayBot: function() {
                if(this.index > 0) this.speak(this.activeScenario.dialogue[this.index - 1].t);
            },

            showAnswer: function() {
                const line = this.activeScenario.dialogue[this.index];
                alert("Say: " + line.hint);
                this.speak(line.hint);
            },

            skip: function() {
                const line = this.activeScenario.dialogue[this.index];
                // Manually add correct bubble to move on
                this.addBubble('user', line.hint, "Skipped"); 
                this.index++;
                this.runStep();
            }
        };

        // =======================================================
        // PART 2: PASTE THE DATA ARRAY BELOW THIS LINE
        // =======================================================

const scenarios = [
        // =================================================================
        // SECTION 1: CONSTRUCTION & TECHNICAL WORK (වැඩබිම)
        // =================================================================

        // --- 1. THE BIG JOB INTERVIEW ---
        {
            id: 1, title: "1. Job Interview", icon: "👔", desc: "Detailed interview questions.",
            dialogue: [
                { r: 'b', t: "Good morning. Please come in and take a seat.", s: "සුභ උදෑසනක්. ඇතුලට ඇවිත් වාඩි වෙන්න." },
                { r: 'u', t: "Good morning sir. Thank you.", s: "සුභ උදෑසනක් සර්. ස්තූතියි.", hint: "Good morning sir" },
                { r: 'b', t: "I have your CV here. Can you introduce yourself?", s: "ඔයාගේ CV එක මං ළඟ තියෙනවා. ඔයා ගැන කියන්න." },
                { r: 'u', t: "I am Nuwan. I have 15 years of construction experience.", s: "මම නුවන්. මට අවුරුදු 15ක පලපුරුද්ද තියෙනවා.", hint: "Nuwan. 15 years experience" },
                { r: 'b', t: "That is impressive. What is your main trade?", s: "ඒක හොඳයි. ඔයාගේ ප්‍රධාන රස්සාව මොකක්ද?" },
                { r: 'u', t: "I am a multi-skilled technician. I do welding and steel fixing.", s: "මම බහු-නිපුණතා ශිල්පියෙක්. මම වෑල්ඩින් සහ යකඩ බඳිනවා.", hint: "Multi-skilled. Welding and steel fixing" },
                { r: 'b', t: "What kind of welding experience do you have?", s: "මොන වගේ වෑල්ඩින් පලපුරුද්දක්ද තියෙන්නේ?" },
                { r: 'u', t: "I am an expert in Arc Welding and structural steel.", s: "මම ආක් වෑල්ඩින් සහ යකඩ ස්ට්‍රක්චර් වලට දක්ෂයි.", hint: "Expert in Arc Welding" },
                { r: 'b', t: "Can you read technical drawings and blueprints?", s: "ඔයාට ප්ලෑන් කියවන්න පුළුවන්ද?" },
                { r: 'u', t: "Yes sir. I can read plans and work independently.", s: "ඔව් සර්. මට ප්ලෑන් කියවලා තනියම වැඩ කරන්න පුළුවන්.", hint: "Yes, read plans independently" },
                { r: 'b', t: "What about concrete work? Can you do that?", s: "කොන්ක්‍රීට් වැඩ ගැන කොහොමද? පුළුවන්ද?" },
                { r: 'u', t: "Yes, I can pour, vibrate and level concrete.", s: "ඔව්, මට වත් කරන්න, වයිබ්‍රේට් කරන්න සහ ලෙවල් කරන්න පුළුවන්.", hint: "Pour, vibrate and level" },
                { r: 'b', t: "Do you hold a heavy vehicle driving license?", s: "බර වාහන බලපත්‍රයක් තියෙනවද?" },
                { r: 'u', t: "Yes, I have a valid heavy vehicle license.", s: "ඔව්, මට වලංගු බර වාහන බලපත්‍රයක් තියෙනවා.", hint: "Yes valid license" },
                { r: 'b', t: "Why do you want to work in Ireland?", s: "ඇයි අයර්ලන්තයේ වැඩ කරන්න ඕන?" },
                { r: 'u', t: "To work hard, earn money and build a future.", s: "මහන්සි වෙලා වැඩ කරලා, සල්ලි හොයලා අනාගතයක් හදන්න.", hint: "Work hard earn money" },
                { r: 'b', t: "Excellent. When can you start working?", s: "නියමයි. කවදද පටන් ගන්න පුළුවන්?" },
                { r: 'u', t: "I can start immediately after I get my visa.", s: "වීසා හම්බුන ගමන් මට පටන් ගන්න පුළුවන්.", hint: "Immediately after visa" },
                { r: 'b', t: "Okay Nuwan. We will contact you soon.", s: "හරි නුවන්. අපි ඉක්මනට කතා කරන්නම්." },
                { r: 'u', t: "Thank you for your time sir.", s: "ඔබේ කාලයට ස්තූතියි සර්.", hint: "Thank you sir" }
            ]
        },

        // --- 2. SITE INDUCTION (SAFETY) ---
        {
            id: 2, title: "2. Safety Induction", icon: "🚧", desc: "Safety rules and PPE check.",
            dialogue: [
                { r: 'b', t: "Welcome to the site Nuwan. I am the Site Manager.", s: "සාදරයෙන් පිළිගන්නවා. මම සයිට් මැනේජර්." },
                { r: 'u', t: "Good morning sir. Happy to be here.", s: "ගුඩ් මෝනින් සර්. මෙහේ ආපු එක සතුටක්.", hint: "Happy to be here" },
                { r: 'b', t: "Do you have your Safe Pass card with you?", s: "ඔයාගේ සේෆ් පාස් කාඩ් එක තියෙනවද?" },
                { r: 'u', t: "Yes sir, here is my Safe Pass card.", s: "ඔව් සර්, මෙන්න මගේ කාඩ් එක.", hint: "Here is my Safe Pass" },
